name: CI

# The repo's definition of done is "unit gate + browser gate both green". Until
# now nothing enforced that on push (PLAN's M3 said "done, except CI"), so a
# broken build could sit on main unnoticed.
#
# Scope note: only gates that are GREEN at this commit run here. The
# sticker-transform (M6) probe is knowingly red while that feature is being
# implemented; a CI that fails for known reasons trains people to ignore it. Add
# each one here in the same commit that makes it green — zoom (M7), the
# selected-sticker pad (M8), the rotate grab and the layers selector have all
# landed that way.
#
# One launcher for every gate: scripts/e2e.sh (E2E_PROBE selects the probe,
# E2E_MOBILE=1 the phone emulation). It also owns the Chrome flag fallback, which
# is why this workflow does NOT force CHROME_BIN: the runner's own Google Chrome
# is found by `command -v google-chrome-stable`, while a chromium/chrome-headless-
# shell build (what setup-chrome hands out for "stable") aborts on --headless=new.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the browser
        # Evidence of which build the gates ran against, and a clear failure
        # instead of a 40-line ConnectionRefused traceback.
        run: |
          command -v google-chrome-stable || {
            echo "no google-chrome-stable on this runner — scripts/e2e.sh will look" >&2
            echo "for chromium next, but prefer installing real Chrome" >&2
            exit 1
          }
          google-chrome-stable --version

      - name: Install dev dependencies
        # This repository's dev box exports NODE_ENV=production, which makes npm
        # skip devDependencies entirely (vitest missing, no lint tooling). Pin it.
        run: NODE_ENV=development npm install --include=dev

      - name: Install the CDP driver's dependency
        # tests/e2e/run.py speaks the DevTools WebSocket through `websockets`;
        # it is present on the dev box but not on a stock runner image.
        run: python3 -m pip install --user websockets

      - name: Unit gate
        run: npm test

      - name: Gate — the user journey (upload → stickers → export)
        run: npm run e2e

      - name: Gate — selection frame wraps the drawn sticker
        env:
          E2E_PROBE: tests/e2e/selection-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — double-click deletes a sticker
        env:
          E2E_PROBE: tests/e2e/delete-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — selection handles are small with a finger-sized hit area
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/handles-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — touch model (1 finger = stickers, 2 fingers = pan)
        run: npm run e2e:mobile

      - name: Gate — tap-to-place survives a pan and a cancelled drag
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/tap-after-pan-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — two-finger image pinch-zoom (focal, clamped, view-only)
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/zoom-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — a new photo starts clean and undo cannot cross photos
        env:
          E2E_PROBE: tests/e2e/photo-boundary-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — the stage hint stays legible over a photo
        env:
          E2E_PROBE: tests/e2e/hint-legibility-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — the selected sticker's pad
        env:
          E2E_PROBE: tests/e2e/pad-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — the rotate handle rotates BY the drag, never to the pointer
        env:
          E2E_PROBE: tests/e2e/rotate-grab-probe.js
        run: bash scripts/e2e.sh

      # NOT run in desktop mode. This probe's `dragWorksWithTouch` needs real
      # touch input, so a desktop run skips that phase and reports 7/8 with the
      # criterion false by design (its declared-false-up-front rule) — the step
      # exits 1 and the job goes red for a reason nobody can act on, which is
      # exactly how a CI stops being read. The touch run below measures all eight
      # criteria, including every desktop one, so it is the gate.
      - name: Gate — the layer drag holds up under a finger
        # The same probe with touch input: that is the only way
        # `dragWorksWithTouch` can be measured, and it is what CI asserts.
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/layers-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — UI/UX polish, desktop (hidden, collapse, fit, touch targets, one format)
        env:
          E2E_PROBE: tests/e2e/polish-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — UI/UX polish, phone (stage share, touch targets, no sideways scroll)
        # Mode-aware: this probe reports a different criteria set per viewport,
        # so both steps are needed for full coverage.
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/polish-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — the picker edits the selected sticker (swap in place)
        env:
          E2E_PROBE: tests/e2e/emoji-swap-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — desktop wheel-zoom at the cursor and middle-button pan
        env:
          E2E_PROBE: tests/e2e/desktop-zoom-probe.js
        run: bash scripts/e2e.sh

      # Installs via the manifest + committed icons (no service worker needed for that:
      # Chrome dropped the fetch-handler requirement in 108/112). The gate's seventh
      # criterion asks the BROWSER, over CDP, whether it would install the app — the rest
      # are the page-side facts that make it so.
      - name: Gate — the app is installable (manifest, icons, browser check)
        env:
          E2E_INSTALLABILITY: "1"
          E2E_PROBE: tests/e2e/install-probe.js
        run: bash scripts/e2e.sh

      # Offline is the app's core promise, and this is the only gate that can see it. It
      # reloads with the network emulated off, then evaluates a SECOND probe from memory —
      # a cache-busted fetch of that probe cannot work offline by design. Before that it
      # clears every cache and unregisters every worker, then seeds a stale 'sf-v0' and a
      # neighbour's 'other-repo-v1' ahead of the reload that installs the worker: activate()
      # runs once, so that ordering is the only way the cleanup rule is observable at all.
      # Without the clear, the persistent browser profile lets the previous run's cache mask
      # a change to what gets precached — verified by mutation, see docs/VERIFICATION.md.
      - name: Gate — offline boots, places and exports from cache, touches no other origin
        env:
          E2E_INSTALLABILITY: "1"
          E2E_PROBE: tests/e2e/install-probe.js
          E2E_PROBE_OFFLINE: tests/e2e/offline-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — two-finger sticker transform (pinch, twist, drag) inside the frame
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/sticker-transform-probe.js
        run: bash scripts/e2e.sh

      # The ONLY probe that exercises the window-level driver for transform moves.
      # A touch pointer is implicitly captured by the element under its press, so when
      # both fingers land on the frame's handles (the rotate dot and the SE corner)
      # their pointermove events go to the HANDLE, not the canvas, and only the window
      # listener keeps the transform alive. sticker-transform-probe aims at the frame
      # INTERIOR (where `.select-box` is pointer-events:none, so the touches reach the
      # canvas), so it does not cover this path. Delete that one line in the window
      # listener and this gate is the only one that goes red — the sticker freezes
      # silently, with no console error.
      - name: Gate — a pinch that lands ON the handles still scales (the window pump)
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/handle-pinch-probe.js
        run: bash scripts/e2e.sh

      # Desktop mode on purpose: every criterion here is measurable with mouse
      # input (the handle drag uses the harness's real mouse drag), so this step
      # has no by-design red — unlike layers-probe, which needs touch.
      - name: Gate — the selected sticker's chrome (two handles + a move mark, no mode)
        env:
          E2E_PROBE: tests/e2e/three-handle-probe.js
        run: bash scripts/e2e.sh

      # Both modes: the wording variant is chosen from `pointer: coarse`, so the
      # desktop run proves the mouse copy and the touch run proves the finger copy.
      - name: Gate — first-run coach mark (once per browser, device-appropriate)
        env:
          E2E_PROBE: tests/e2e/coach-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — first-run coach mark under touch
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/coach-probe.js
        run: bash scripts/e2e.sh

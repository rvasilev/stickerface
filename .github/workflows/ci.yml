name: CI

# The repo's definition of done is "unit gate + browser gate both green". Until
# now nothing enforced that on push (PLAN's M3 said "done, except CI"), so a
# broken build could sit on main unnoticed.
#
# Scope note: only gates that are GREEN at this commit run here. The
# sticker-transform (M6) and zoom (M7) probes are knowingly red while those
# features are being implemented; a CI that fails for known reasons trains people
# to ignore it. Add each one here in the same commit that makes it green.
#
# One launcher for every gate: scripts/e2e.sh (E2E_PROBE selects the probe,
# E2E_MOBILE=1 the phone emulation). It also owns the Chrome flag fallback, which
# is why this workflow does NOT force CHROME_BIN: the runner's own Google Chrome
# is found by `command -v google-chrome-stable`, while a chromium/chrome-headless-
# shell build (what setup-chrome hands out for "stable") aborts on --headless=new.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the browser
        # Evidence of which build the gates ran against, and a clear failure
        # instead of a 40-line ConnectionRefused traceback.
        run: |
          command -v google-chrome-stable || {
            echo "no google-chrome-stable on this runner — scripts/e2e.sh will look" >&2
            echo "for chromium next, but prefer installing real Chrome" >&2
            exit 1
          }
          google-chrome-stable --version

      - name: Install dev dependencies
        # This repository's dev box exports NODE_ENV=production, which makes npm
        # skip devDependencies entirely (vitest missing, no lint tooling). Pin it.
        run: NODE_ENV=development npm install --include=dev

      - name: Install the CDP driver's dependency
        # tests/e2e/run.py speaks the DevTools WebSocket through `websockets`;
        # it is present on the dev box but not on a stock runner image.
        run: python3 -m pip install --user websockets

      - name: Unit gate
        run: npm test

      - name: Gate — the user journey (upload → stickers → export)
        run: npm run e2e

      - name: Gate — selection frame wraps the drawn sticker
        env:
          E2E_PROBE: tests/e2e/selection-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — double-click deletes a sticker
        env:
          E2E_PROBE: tests/e2e/delete-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — selection handles are small with a finger-sized hit area
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/handles-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — touch model (1 finger = stickers, 2 fingers = pan)
        run: npm run e2e:mobile

      - name: Gate — tap-to-place survives a pan and a cancelled drag
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/tap-after-pan-probe.js
        run: bash scripts/e2e.sh

      - name: Gate — two-finger image pinch-zoom (focal, clamped, view-only)
        env:
          E2E_MOBILE: "1"
          E2E_PROBE: tests/e2e/zoom-probe.js
        run: bash scripts/e2e.sh
